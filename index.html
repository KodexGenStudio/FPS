<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal FPS & Refresh Rate Tester</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }
        .stat-group {
            text-align: center;
        }
        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }
        canvas {
            display: block;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="stat-group">
            <div class="stat-label">Device Refresh Rate</div>
            <div class="stat-value" id="hzDisplay">Detecting...</div>
        </div>
        <div class="stat-group">
            <div class="stat-label">Current FPS</div>
            <div class="stat-value" id="fpsDisplay">--</div>
        </div>
        <div class="stat-group">
            <div class="stat-label">Frame Time</div>
            <div class="stat-value" id="msDisplay">-- ms</div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Object movement state variables
        let x = canvas.width / 2;
        let y = canvas.height / 2;
        let vx = 10; // Velocity vector X
        let vy = 7;  // Velocity vector Y
        const radius = 25;

        // Metrics tracking
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTimer = 0;
        let hzSamples = [];

        function animate(currentTime) {
            const delta = currentTime - lastTime;
            lastTime = currentTime;

            // Update FPS metrics every second
            frameCount++;
            fpsTimer += delta;

            if (fpsTimer >= 1000) {
                const currentFps = Math.round((frameCount * 1000) / fpsTimer);
                document.getElementById('fpsDisplay').innerText = currentFps;
                frameCount = 0;
                fpsTimer = 0;
            }

            // Real-time dynamic display refresh rate (Hz) estimation based on frame intervals
            if (delta > 0) {
                const instantaneousHz = Math.round(1000 / delta);
                if (instantaneousHz > 15 && instantaneousHz < 500) {
                    hzSamples.push(instantaneousHz);
                    if (hzSamples.length > 25) {
                        hzSamples.shift();
                        const avgHz = Math.round(hzSamples.reduce((a, b) => a + b, 0) / hzSamples.length);
                        document.getElementById('hzDisplay').innerText = avgHz + ' Hz';
                    }
                }
            }

            document.getElementById('msDisplay').innerText = delta.toFixed(1) + ' ms';

            // Clear canvas viewport
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update moving object positions
            x += vx;
            y += vy;

            // Handle boundary collisions (bouncing smoothly off edges)
            if (x - radius < 0 || x + radius > canvas.width) {
                vx = -vx;
                x = Math.max(radius, Math.min(canvas.width - radius, x));
            }
            if (y - radius < 0 || y + radius > canvas.height) {
                vy = -vy;
                y = Math.max(radius, Math.min(canvas.height - radius, y));
            }

            // Render glowing object on screen
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#38bdf8';
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 18;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0; // Reset shadow

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
